name: Deploy Tunnel Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tunnel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install cross-compilation deps
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build server binary
        run: |
          set -euo pipefail
          VERSION=$(git describe --tags --always --dirty)
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X github.com/nullbore/nullbore-server/internal/api.ServerVersion=$VERSION" \
            -o nullbore-server ./cmd/server

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.NB_PROD_SSH_KEY }}

      - name: Add host key
        env:
          PROD_HOST: ${{ secrets.NB_PROD_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy server binary
        env:
          PROD_HOST: ${{ secrets.NB_PROD_HOST }}
          PROD_USER: ${{ secrets.NB_PROD_USER }}
        run: |
          set -euo pipefail
          : "${PROD_HOST:?}" ; : "${PROD_USER:?}"

          scp ./nullbore-server \
            "$PROD_USER@$PROD_HOST:/usr/local/bin/nullbore-server.new"

          ssh "$PROD_USER@$PROD_HOST" <<'EOF'
          set -euo pipefail
          chmod +x /usr/local/bin/nullbore-server.new
          mv /usr/local/bin/nullbore-server.new /usr/local/bin/nullbore-server
          systemctl restart nullbore-server
          sleep 2
          systemctl is-active --quiet nullbore-server
          EOF

          # Health check — fail the deploy if the relay can't authenticate to
          # the dashboard (shared-secret mismatch = every API key refused).
          HEALTH_URL="${PROD_HEALTH_URL:-https://tunnel.nullbore.com/health}"
          for i in $(seq 1 10); do
            body="$(curl -fsS "$HEALTH_URL" || true)"
            dash="$(printf '%s' "$body" | jq -r '.dashboard // empty' 2>/dev/null || true)"
            [ -n "$dash" ] && break
            sleep 3
          done
          echo "health: $body"
          if [ "$dash" != "ok" ]; then
            echo "::error::relay→dashboard link is '${dash:-unknown}' — check -webhook-secret (relay) vs -internal-secret (dashboard)"
            exit 1
          fi

      - name: Deploy summary
        run: echo "✅ Tunnel server deploy complete" >> "$GITHUB_STEP_SUMMARY"
